<!DOCTYPE html>
<html lang="pt-br">
{% load static %}


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kanban{% endblock %}</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="{% static 'img/logo_site.png' %}">
    
    <style>
    *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    button{
        cursor: pointer;
    }
    body{
        background: rgb(31, 31,33);
        max-height: 100vh;
        margin:0;
        padding: 0 !important;

        overflow: hidden !important;
    }
    .container-login{
        min-height:100vh;

        display:flex;
        justify-content:center;
        align-items:center;

        padding:20px;
    }
    .card-login{
        width: 1000px;
        height: 600px;

        display: flex;

        background: #0f1117;

        border-radius: 30px;

        overflow: hidden;

        box-shadow:
            0 20px 60px rgba(0,0,0,.5);
    }
    .error-messages{
        color:#ff6b6b;
        background:#2d1111;
        border:1px solid #6b1f1f;
        padding:12px;
        border-radius:10px;
        margin-bottom:20px;
    }


    .lado-login{
        width: 50%;
        padding: 70px;
        display: flex;
        flex-direction:column;
        justify-content:center;

    }

    .lado-login h1{
        color: white;
        font-size: 45px;
        margin-bottom: 40px;
    }

    .versao{
        margin-top:25px;
        font-size:12px;
        color:#999;
    }
    .campo-login{
        position: relative;
        margin-bottom: 20px;
    }
    .campo-login label{
        display:block;

        color:#9ca3af;

        font-size:13px;

        margin-bottom:8px;
    }
    .campo-login input{
        width: 100%;
        height: 55px;
        

        padding-left: 45px;
        padding-right: 45px;

        background: #181a22;

        border: 1px solid #2c2f3a;
        border-radius: 12px;

        color: white;
    }
    .campo-login > .fa-user{
        position: absolute;

        left: 15px;
        top: 58%;

        transform: translateY(-50%);

        color: #9ca3af;
    }
    .campo-login > .fa-lock{
        position: absolute;

        left: 15px;
        top: 55%;

        transform: translateY(-50%);

        color: #9ca3af;

        z-index: 10;
        
    }
    .olho-login{
        position:absolute;

        right:15px;
        top:50%;

        transform:translateY(-90%);

        color:#9ca3af;
        cursor:pointer;
    }
    .olho-login:hover{
        color: #fff;
    }

    /* Customização dos Campos de Cadastro (Inputs) */
    .campo-cadastro {
        width: 100%;
        /* Em vez de altura fixa, usamos clamp para os inputs encolherem em telas pequenas */
        height: clamp(40px, 5.5vh, 55px); 
        display: flex;
        align-items: center;
        position: relative;
    }

    .campo-cadastro label{
        display:block;

        color:#9ca3af;

        font-size:13px;

        margin-bottom:8px;
    }

    /* Estilização interna dos inputs (ajuste para ocuparem a altura dinâmica do container) */
    .campo-cadastro input {
        width: 100%;
        height: 100%;
        padding: 0 15px 0 45px; /* Ajuste o padding esquerdo para o ícone */
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.1);
        background: rgba(255,255,255,0.05);
        color: white;
        font-size: clamp(14px, 1.8vh, 16px);
        outline: none;
    }

    .campo-cadastro > .fa-user{
        position: absolute;

        left: 15px;
        top: 40%;

        transform: translateY(-50%);

        color: #9ca3af;
    }
    .campo-cadastro > .fa-at{
        position: absolute;

        left: 15px;
        top: 40%;

        transform: translateY(-50%);

        color: #9ca3af;
    }
    .campo-cadastro > .fa-envelope{
        position: absolute;

        left: 15px;
        top: 40%;

        transform: translateY(-50%);

        color: #9ca3af;
    }
    .campo-cadastro > .fa-lock{
        position: absolute;

        left: 15px;
        top: 40%;

        transform: translateY(-50%);

        color: #9ca3af;
    }
    .campo-reset-senha > .fa-envelope{
        position: absolute;

        left: 655px;
        top: 55%;

        transform: translateY(-50%);

        color: #9ca3af;
    }


    input:focus{
        box-shadow:0 0 15px rgba(192,77,255,.5);
        border:1px solid #c04dff;
    }
    .senha-wrapper{
        position:relative;
    }
    .olho-confirmar-senha-nova{
        position:absolute;
        right:55px;
        top:42%;
        transform:translateY(-50%);
        color:#9ca3af;
        cursor:pointer;
    }
    .olho-cadastro{
        position:absolute;

        right:15px;
        top:50%;

        transform:translateY(-90%);

        color:#9ca3af;
        cursor:pointer;
    }

    .link-senha{
        display:block;

        text-align:right;

        margin-bottom:25px;

        color:#9ca3af;

        text-decoration:none;

        font-size:13px;
    }



    .campo .fa-user,
    .campo .fa-lock{
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-90%);
        color: #888;
    }
    .campo .toggle-password{
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-80%);
        cursor: pointer;
        color: #888;
    }
    
    input{
        width: 80%;
        padding:14px;
        margin-bottom:15px;
        border: 1px solid #2c2f3a;
        border-radius:10px;
        outline:none;
        font-size:15px;
        background: #181a22;
        color: white;
    }

    .link-cadastro{
        text-align:center;
        margin-top:25px;
        color:#9ca3af;
        text-decoration:none;
        font-size:14px;
    }

    .lado-imagem{
        width:50%;

        position:relative;

        background:
        linear-gradient(
            rgba(15,17,23,.3),
            rgba(15,17,23,.3)
        ),
        url("{% static 'img/imagem_kanban.png' %}");

        background-size:cover;
        background-position:center;
    }
    
    .overlay{
        position:absolute;
        inset:0;

        background:
        linear-gradient(
            to left,
            transparent,
            #0f1117
        );
    }

    .conteudo-imagem{
        position:absolute;

        bottom:60px;
        left:60px;

        z-index:2;

        color:white;
    }

    .conteudo-imagem h2{
        font-size:40px;
        margin-bottom:10px;
    }

    .conteudo-imagem p{
        color:#d1d5db;
        max-width:350px;
    }

    .lado-login button{
        display:block;
        width:70%;
        margin:0 auto;
        padding:14px;
        border:none;
        border-radius:10px;
        background: linear-gradient(
            90deg,
            #7b61ff,
            #d946ef
        );
        color:white;
        font-size:16px;
        cursor:pointer;
        transition:0.3s;
        
    }

    button:hover,
    .button:hover{
        transform:translateY(-2px);
    }

    .logo{
        font-size: 60px;
        color: #2a5298;
        margin-bottom: 15px;
    }
    @keyframes aparecer {
        from {
            opacity: 0;
            transform: translateY(20px)
        }
        to{
            opacity: 1;
            transform: translateX(0);
        }
    }

    .container-login{
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 50px;
        padding: 40px;
    }

    a{
        display:block;
        margin-top:18px;
        text-decoration:none;
        color:#2563eb;
        font-size:14px;
    }
    .lado-esquerdo{
        width: 550px;
        height: 650px;
        border-radius: 20px;

        display: flex;
        align-items: center;
        justify-content: center;

        background: linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );

        color: white;
        padding: 50px;
    }

    .conteudo-esquerdo{
        max-width: 500px;
    }

    .conteudo-esquerdo h2{
        font-size: 42px;
        margin-bottom: 20px;
    }

    .conteudo-esquerdo p{
        font-size: 18px;
        line-height: 1.6;
    }

    .card-register{
        width: 550px;
        max-width: 100%;
        box-sizing: border-box; /* Garante que o padding interno não estoure a largura */

        /* CONTROLADOR DE ALTURA: O card nunca será maior que a tela */
        max-height: calc(100vh - 40px);


       /* Transforma o card em um container flexível vertical */
        display: flex;
        flex-direction: column;
        justify-content: space-between; /* Distribui os elementos aproveitando o espaço */

        padding: clamp(20px, 4vh, 45px);

        background: #0f1117;
        border-radius: 25px;

        box-shadow: 0 20px 60px rgba(0,0,0,.4);

        text-align: center;

        max-height: calc(100vh - 40px); 
        overflow-y: auto; /* Se a tela for minúscula, o scroll fica APENAS dentro do card, não na página */

        
    }
    /* Formulário flexível para controlar o espaçamento dos inputs */
    .card-register form {
        display: flex;
        flex-direction: column;
        /* O gap diminui dinamicamente em telas menores */
        gap: clamp(10px, 1.8vh, 20px); 
        width: 100%;
    }

    .card-register h1 {
        color: white;
        font-size: clamp(24px, 3.5vh, 38px);
        margin-bottom: clamp(5px, 1vh, 10px);
    }

    .container-register{
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 50px;
        padding: 20px;
        box-sizing: border-box;
        padding: clamp(10px, 2vh, 30px);
        
    }

    .subtitulo {
        color: #9ca3af;
        font-size: clamp(13px, 1.6vh, 16px);
        margin-bottom: clamp(15px, 2.5vh, 30px);
    }
    .logo{
        font-size: clamp(35px, 5vh, 55px);
        color: #c04dff;
        margin-bottom: clamp(5px, 1vh, 15px);
    }
    .button{
        width: 100%;
        height: 55px;

        display: flex;
        justify-content: center;
        align-items: center;

        border: none;

        border-radius: 12px;

        background: linear-gradient(
            90deg,
            #7b61ff,
            #d946ef
        );

        color: white;
        text-decoration: none;
        font-size: 16px;

        cursor: pointer;
    }
    .card-register button{
        width: 100%;
        /* Altura acompanha o tamanho dos inputs dinamicamente */
        height: clamp(40px, 5.5vh, 55px); 
        border: none;
        border-radius: 12px;
        background: linear-gradient(90deg, #7b61ff, #d946ef);
        color: white;
        text-decoration: none;
        font-size: clamp(14px, 1.8vh, 16px);
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: clamp(5px, 1vh, 15px);
    }
    .link-login {
        display: block;
        margin-top: clamp(10px, 2vh, 20px);
        color: #9ca3af;
        text-decoration: none;
        font-size: clamp(13px, 1.6vh, 15px);
    }
    .container-reset{
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        padding: 20px;

        
    }
    
    .card-reset{
        width: 500px;
        max-width: 95%;

        background:#0f1117;

        padding: 50px;

        border-radius:25px;

        text-align:center;

        box-shadow:
            0 20px 60px rgba(0,0,0,.4);

    }
    .card-reset p{
        color:rgba(255,255,255,.85);
        line-height:1.6;
    }

    .icone-sucesso{
        color: white;
    }

    .card-reset h1,
    .card-reset h2{
        color:white;
        font-size:40px;
        margin-bottom:10px;
    }

    .card-reset button{
        width:100%;
        height:55px;

        border:none;

        border-radius:12px;

        color:white;

        cursor:pointer;

        background:linear-gradient(
            90deg,
            #7b61ff,
            #d946ef
        );
    }
    .campo-reset-senha  i{
        position: absolute;

        left: 695px;
      
        transform: translateY(120%);

        color: #9ca3af;

        z-index: 1;
    }
    
    .campo-reset-senha input{
        width: 100%;
        height: 55px;

        padding-left: 45px; /* espaço para o ícone */

        border-radius: 12px;
    }
    
    .link-voltar{
        display:block;

        margin-top:20px;

        color:#9ca3af;

        text-decoration:none;
    }
    .label-reset{
        color:rgba(255,255,255,.85);
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
        display: block;
    }

    /* mensagem de erro do criar cadastro */ 
    .alerta{
        padding:12px;
        border-radius:8px;
        margin-bottom:15px;
        font-size:14px;
    }

    /* mensagem de erro do criar cadastro */
    .alerta.error{
        background: rgb(45,17,17);
        color: rgb(255, 104, 99);
        font-family: Inter, sans-serif;
        font-weight: 400;
        

        border: 1px solid rgba(255,83,54,.35);
        border-radius: 16px;
    }

    /* mensagem de sucesso do criar cadastro */
    .alerta.success{
        background: #0f2918;
        color: #4ade80;

        border: 1px solid rgba(74,222,128,.35);
        border-radius: 16px;
    }

    .user-area{
        display:flex;
        gap:15px;
        align-items:center;
    }

    .btn-sair{
        background:#ef4444;
        color:white;
        padding:10px 16px;
        border-radius:8px;
        text-decoration:none;
    }

    html{
        margin: 0;
        padding: 0;
        min-height: 100%;
        overflow-x: hidden;
        overflow-y: auto;
    }

   
    /* Topo */
    .topbar{
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
        color: white;
    }

    .user-avatar{
        width: 50px;
        height: 50px;
        border-radius: 50%;
        background: #2563eb;
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 20px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 5px 15px rgba(0,0, 1, 1);
        transition: 0.3s;
        overflow: hidden;
        border: 2px solid white;
    }
    .user-avatar:hover{
        transform: scale(1.05);
        background:#1d4ed8;
    }
    .user-avatar img{
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 50%;
    }
    
    .dropdown-menu{
        position: absolute;
        right: clamp(10px, 2vw, 20px);
        top: clamp(85px, 6vh, 50px);

        width: clamp(180px, 22vw, 240px);

        background: #202124;
        border-radius: 12px;
        box-shadow: 0 15px 30px rgba(0,0,0,0.15);

        display: none;
        overflow: hidden;
        z-index: 999;
    }
    .dropdown-menu a{
        display: block;
        padding: 14px;
        color: white;
        text-decoration: none;
        font-size: 15px;
        border-bottom: 1px solid #eee;

    }
    .dropdown-menu a:hover{
        background:#616161;
    }
    .topbar h1{
        font-size: 42px;
        margin: 0;
    }

    .dashboard {
        width: 100%; /* Ocupa a largura total */
        min-height: 100vh;
        padding-top: 30px;
        
        display: flex;
        flex-direction: column;
        box-sizing: border-box; /* Garante que o padding não aumente o tamanho total */
        padding-left: 15px;
        
    }

    /* Colunas */
    .board {
        /* Mantém o background fixo e bonito */
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        border-radius: 16px;
        margin-left: 70px;
        margin-bottom: 20px;
        flex-grow: 1;
        flex-wrap: nowrap;

        /* Adicionamos um padding interno para afastar o conteúdo das bordas do fundo */
        padding: 20px; 
        
        /* Removemos o scroll daqui para ele não arrastar o fundo */
        overflow: visible; 
    }

    .board-content {
        /* Passamos o comportamento de flex e scroll para cá */
        display: flex;
        gap: 20px;
        align-items: flex-start;
        scrollbar-width: thin;
        
        overflow-x: auto; 
        overflow-y: visible; 

        /* Espaçamentos nas laterais para o card da direita não cortar */
        padding-left: 10px; 
        padding-right: 30px; 

        /* Aumente ou diminua este padding para subir ou descer a barra de rolagem */
        padding-bottom: 40px; 
    }

    /* O card da coluna volta ao seu estado original, sem gambiarras de margem */
    .coluna {
        flex: 0 0 320px;
        width: 320px;
        min-width: 320px;
        max-width: 350px;

        height: clamp(320px, 70vh, 800px);
        background: #202124;
        border-radius: 14px;
        padding: 20px;

        box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        border: 1px solid rgba(0,0,0,0.05);

        display: flex;
        flex-direction: column;
    }

    .lista-cards{
        overflow-y: auto;
        flex: 1; /* ocupa o espaço restante da coluna */
        padding-right: 6px;
    }

    /* opcional: melhorar visual do scroll */
    .lista-cards::-webkit-scrollbar{
        width: 6px;
    }

    .lista-cards::-webkit-scrollbar-thumb{
        background: rgba(0,0,0,0.2);
        border-radius: 10px;
    }
    .coluna:hover{
        transform: translateY(-3px);
        box-shadow: 0 14px 30px rgba(0,0,0,0.18);
    }

    .coluna h2{
        margin-top: 0;
        margin-bottom: 18px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.3px;
        color: #1f2937;
    }
    .coluna h2 span{
        position: relative;
        top: -3px;
        right: -15px;
        background: #111827;
        color: white;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 12px;
        margin-left: 6px;
    }

    /* Tarefa */
    .card-task{
        background: #26282c;
        border: 1px solid rgba(255,255,255,.05);
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 12px;
        box-shadow: 0 3px 8px rgba(0,0,0,0.08);
        cursor: pointer;
        transition: 0.2s;
        position: relative;
        z-index: 1;
        color: white;
        
    }
    .card-task.menu-open{
        z-index: 100;
    }
    

    .card-task:hover{
        transform: translateY(-2px);
    }
    .modal-crop{
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.65);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 5000;
        border-radius: 12px;
    }

    
    /*Modal para recortar a imagem do usuário*/
    .crop-box{
        position: relative;
        background: rgb(31, 31,33);
        padding: 25px;
        width: 560px;
        text-align: center;
        border-radius: 12px;
    }

    #imagemCrop{
        max-width: 100%;
        max-height: 500px;
        display: block;
        margin: auto;
    }
    .crop-area{
        position: relative;
    }
    .cropper-container {
        border-radius: 14px !important;
        overflow: hidden !important;
    }


    .btn-confirmar{
        position: absolute;

        right: 15px;
        bottom: 15px;

        background: #22c55e;
        border: none;

        width: 55px;
        height: 55px;

        border-radius: 50%;
        font-size: 22px;
        cursor: pointer;
        z-index: 999;
    }
    
    .btn-confirmar:hover{
        background: linear-gradient(
            135deg,
            #22c55e,
            #16a34a
        );

        transform: scale(1.08);

        box-shadow:
            0 0 25px rgba(34,197,94,.6);
    }
    .btn-confirmar:active{
        transform: scale(.95);
    }

    .btn-fechar{
        position: absolute;
        top: -12px;
        right: -12px;

        width: 30px;
        height: 30px;

        color: white;
        border-radius: 50%;
        border: none;
        background: #dc2626;

        font-size: 16px;
        font-weight: 600;

        cursor: pointer;
        z-index: 1000;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    .btn-fechar:hover{
        background: #dc2626;
    }
    
    .modal-confirmar{
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.55);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }
    .modal-confirmar, .modal-busca {
        z-index: 3000 !important; /* Acima do menu lateral */
    }

    .box-confirmar{
        background: rgb(31, 31,33);
        width: 380px;
        max-height: calc(100vh - 80px);
        border-radius: 14px;
        padding: 25px;
        text-align: center;
        animation: aparecer .2s ease;
        overflow-y: auto;
        animation: fadeIn 0.2s ease-in-out;
    }

    .box-confirmar h3{
        margin-bottom: 20px;
        font-size: 22px;
        color: #6b7280;
    }

    .box-confirmar p{
        color: #6b7280;
        margin-bottom: 25px;
    }

    .box-confirmar input[type="text"] {
        position: relative;
        z-index: 10000;
        background: #26282c;
        color: white;
    }

    .textarea-descricao{
        width: 100%;

        background: #222; /* mesmo tom dos cards */
        color: #e8eaed;

        border: 1px solid #3c4043;
        border-radius: 10px;

        padding: 12px;
        resize: vertical;

        font-size: 14px;
        outline: none;
    }
    .textarea-descricao:focus{
        border-color: #8ab4f8;
        box-shadow: 0 0 0 3px rgba(138,180,248,.15);

        transition: .2s;
    }

    .btn-fechar-modal-usuarios:hover{
        background: #b91c1c;
    }  
    #modalListaUsuarios{
        z-index: 2000;
    }

    #modalNovoUsuario{
        z-index: 2100;
    }
    .modal-novo-usuario{
        position: relative;

        width: 90%;
        max-width: 900px;
        max-height: 90vh;

        background: #202124;
        border-radius: 14px;
        padding: 30px;

        display: flex;
        flex-direction: column;
        gap: 16px;

        box-shadow: 0 15px 40px rgba(0,0,0,.4);

        overflow-y: auto;
    }

    .modal-novo-usuario h2{
        color: #fff;
        text-align: center;
        margin-bottom: 10px;
        font-size: 24px;
    }

    .modal-novo-usuario input{
        width: 100%;
        padding: 12px 15px;

        border: 1px solid #444;
        border-radius: 8px;

        background: #2b2d31;
        color: #fff;
        font-size: 15px;

        outline: none;
        transition: .2s;
    }

    .modal-novo-usuario input:focus{
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59,130,246,.2);
    }

    .modal-novo-usuario label{
        display: flex;
        align-items: center;
        gap: 10px;

        color: #fff;
        font-size: 15px;
        cursor: pointer;
        }

        .modal-novo-usuario input[type="checkbox"]{
            width: 18px;
            height: 18px;
        }

    

    .campo-perfil{
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 15px;
        border: 1px solid #3b3b3b;
        border-radius: 8px;
        background: #2b2d31;
    }

    .titulo-perfil{
        color: #fff;
        font-size: 15px;
        font-weight: 600;
    }

    .campo-perfil label{
        display: flex;
        align-items: center;
        gap: 10px;
        color: #fff;
        cursor: pointer;
        font-size: 15px;
    }

    .campo-perfil input[type="radio"]{
        width: 16px;
        height: 16px;
        cursor: pointer;
        accent-color: #2563eb; /* Cor do radio */
    }
    /* CARD */
    .status-card {
        display: block;
        border: 1px solid #2b2f3a;
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: 0.2s;
        background: #1f2430;
    }
    .status-card:hover {
        border-color: #4c5cff;
    }
    
    /* esconder radio padrão */
    .status-card input {
        display: none;
    }
    /* conteúdo interno */
    .status-content {
        display: flex;
        align-items: flex-start;
        gap: 12px;
    }
    /* bolinha colorida */
    .status-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        margin-top: 4px;
    }

    .status-dot.ativo {
        background: #22c55e;
    }

    .status-dot.inativo {
        background: #ef4444;
    }

    .status-content small {
        display: block;
        font-size: 12px;
        color: #9aa4b2;
        margin-top: 2px;
    }

    /* efeito quando selecionado */
    .status-card:has(input:checked) {
        border: 1px solid #4c5cff;
        background: #232a3a;
    }

    /* textos */
    .status-content strong {
        display: block;
        font-size: 15px;
    }
    .campo-senha-cadastro-usuario{
        position: relative;
        width: 100%;
    }

    .campo-senha-cadastro-usuario input{
        width: 100%;
        padding-right: 45px;
    }

    .toggle-password-cadastro-usuario{
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-80%);
        cursor: pointer;
        color: #888;
    }

    .toggle-password-cadastro-usuario:hover{
        color: #fff;
    }

    .descricao-perfis{
        color: #fff;
        text-align: left;
        margin: 20px 0;
        line-height: 1.6;
    }
    .descricao-perfis .perfil{
        background: #262626;
        border: 1px solid white;
        border-radius: 10px;
        padding: 16px;
        margin-bottom: 16px;
    }
    .aviso-alterar-senha{
        margin-top: 18px;
        padding: 14px 16px;
        border-radius: 10px;
        background: #fff8e1;
        border: 1px solid #ffe082;
        color: #795548;
        font-size: 14px;
        line-height: 1.5;
    }

    .campo-status{
        margin-top: 18px;
    }

    .campo-status .titulo-perfil{
        display: block;
        font-weight: 600;
        margin-bottom: 12px;
    }
    .campo-status label{
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        cursor: pointer;
        font-size: 15px;
    }
    /* ==========================
    INFORMAÇÕES DO USUÁRIO
    ========================== */

    .informacoes-usuario{
        margin-top: 20px;
        padding: 16px;
        background: #2b2d31;
        border: 1px solid #3b3b3b;
        border-radius: 10px;
    }

    .informacoes-usuario p{
        margin: 8px 0;
        font-size: 14px;
        color: #555;
    }

    .informacoes-usuario strong{
        color: white;
    }

    .informacoes-usuario span{
        color: #666;
        font-weight: 500;
    }
    /* container principal dividido */
    .modal-content-editar-usuario{
        display: flex;
        gap: 20px;
    }
    /* colunas */
    .lado-esquerdo-editar-usuario{
        flex: 1.2;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .lado-direito-editar-usuario{
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 16px;
    }
    /* separação visual */
    .lado-esquerdo-editar-usuario{
        padding-right: 20px;
        border-right: 1px solid #333;
    }

    /* melhora spacing dos blocos */
    .lado-esquerdo-editar-usuario input{
        margin-bottom: 0;
    }
    .lado-direito-editar-usuario .campo-perfil,
    .lado-direito-editar-usuario .campo-status{
        margin-top: 0;
    }

    .perfil-card{
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.2s;
        margin-top: 10px;
    }

    .perfil-card input{
        display: none;
    }

    .perfil-content{

    }

    .perfil-content i{
        font-size: 20px;
        color: #555;
    }

    /* quando selecionado */
    .perfil-card:has(input:checked){
        border-color: #4a90e2;

    }

  
    .perfil-card:has(input:checked) .perfil-content i {

    }
    .divisor{

    .campo-nome-completo,
    .campo-nome-usuario,

    .campo-nome-completo label,

        margin-bottom: 6px;

    .campo-nome-completo input,

        padding: 14px 16px;
    }
